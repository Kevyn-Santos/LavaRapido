openapi: 3.0.3
info:
  title: SplashFast
  version: "1.2"
  description: |
    Documentação das rotas HTTP da aplicação web SplashFast (Jakarta Servlets + JSP, Tomcat 11).

    Observações gerais:
    - Não há `web.xml`; todas as rotas vêm de `@WebServlet` e de JSPs públicas (fora de `WEB-INF`).
    - `EncodingFilter` (`@WebFilter("/*")`) força UTF-8 em todas as requisições e respostas.
    - As rotas do site renderizam HTML (forward para JSP) ou redirecionam (302).
    - A API JSON do app mobile fica em `/api/v1/*` (tag *API mobile*): corpo e resposta `application/json; charset=UTF-8`,
      erros sempre `{"erro": "mensagem"}`, autenticação pela mesma sessão do site (cookie `JSESSIONID`, atributo `clienteId`).
      `ApiAuthFilter` devolve 401 sem sessão; públicas: `POST /api/v1/auth/login` e `GET /api/v1/servicos`.
      O cliente é sempre o da sessão (nenhuma rota recebe `idcliente`). Sem logout (a sessão expira) e sem cadastro pela API
      (o cadastro é só na web). Registros: `plano-pendencias-api-mobile.md`.
    - Os formulários enviam `application/x-www-form-urlencoded`.
    - Autenticação por sessão HTTP (cookie `JSESSIONID`):
      - cliente: `POST /login` grava `clienteId`/`clienteNome` na sessão;
      - colaborador: `POST /colaborador/login` grava `colaboradorId`/`colaboradorNome`/`nivelAcesso`.
      Rotas de cliente sem sessão redirecionam para `/login`; rotas de colaborador sem sessão redirecionam
      para `/colaborador/login` e, com nível insuficiente, retornam 403.
    - Hierarquia de níveis: `ADMINISTRADOR` (3) > `ATENDENTE` (2) > `OPERACIONAL` (1).
    - Erros de banco tratados por `WebSupport.erroBanco` respondem 500 com forward para `/WEB-INF/views/erro.jsp` (atributo `mensagem`).
      Erros não tratados (`RuntimeException`) resultam na página de erro padrão do Tomcat (HTTP 500).
servers:
  - url: http://{host}:{port}/{contextPath}
    description: Tomcat local (copiar target/FastSplash.war para /var/lib/tomcat11/webapps; em Docker/Render o WAR é ROOT.war e o contexto é vazio)
    variables:
      host:
        default: localhost
      port:
        default: "8080"
      contextPath:
        default: FastSplash
        description: Nome do WAR implantado (finalName `FastSplash` no pom.xml).
security:
  - {}
tags:
  - name: Páginas
    description: JSPs acessíveis diretamente
  - name: Autenticação
    description: Login/logout de clientes e colaboradores e configuração do administrador inicial
  - name: Área do cliente
    description: Portal, veículos e agendamentos do cliente autenticado
  - name: Administração
    description: Painel de colaboradores (serviços, equipe, atendimentos, pagamentos)
  - name: Clientes
    description: Cadastro de clientes
  - name: API mobile
    description: API JSON `/api/v1/*` consumida pelo app Flutter (sessão `HttpSession`)
paths:
  /:
    get:
      tags: [Páginas]
      summary: Página inicial (welcome file index.jsp)
      description: Equivalente a `GET /index.jsp`.
      operationId: paginaInicial
      responses:
        "200":
          $ref: "#/components/responses/IndexHtml"
  /index.jsp:
    get:
      tags: [Páginas]
      summary: Página inicial (landing)
      description: |
        Landing page com os serviços e links para `/cadastro` ("Criar conta") e `/colaborador/login`
        ("Acesso da equipe").
      operationId: indexJsp
      responses:
        "200":
          $ref: "#/components/responses/IndexHtml"
  /cadastro.jsp:
    get:
      tags: [Páginas]
      summary: Formulário de cadastro de cliente (novo layout)
      description: |
        Formulário com nome, CPF, telefone, e-mail e senha (mín. 8) e link para `/login`.
        O `action` aponta para `POST /cadastro` (`CadastroClienteServlet`). Também é a view de `GET /cadastro`.
      operationId: cadastroJsp
      responses:
        "200":
          $ref: "#/components/responses/Html"
  /health.jsp:
    get:
      tags: [Páginas]
      summary: Health check
      description: Página estática com o texto `OK`.
      operationId: healthCheck
      responses:
        "200":
          $ref: "#/components/responses/Html"

  /login:
    get:
      tags: [Autenticação]
      summary: Formulário de login do cliente
      description: Servlet `LoginServlet`. Forward para `/WEB-INF/views/login.jsp`.
      operationId: formLoginCliente
      parameters:
        - $ref: "#/components/parameters/CadastroQuery"
      responses:
        "200":
          $ref: "#/components/responses/Html"
    post:
      tags: [Autenticação]
      summary: Autentica um cliente
      description: |
        Chama `new DAOCliente().autenticar(email, senha)` (devolve `ClienteView`). Em sucesso invalida a sessão anterior, cria uma nova com
        `clienteId` e `clienteNome` e redireciona para `/portal`.
      operationId: loginCliente
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginForm"
      responses:
        "302":
          description: Login realizado. `Location` → `/portal`.
        "400":
          description: E-mail ou senha não preenchidos. Forward para `/WEB-INF/views/login.jsp` com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "401":
          description: Credenciais inválidas. Forward para `/WEB-INF/views/login.jsp` com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/ErroBanco"
  /colaborador/login:
    get:
      tags: [Autenticação]
      summary: Formulário de login de colaborador
      description: Servlet `ColaboradorLoginServlet`. Forward para `/WEB-INF/views/colaborador-login.jsp`.
      operationId: formLoginColaborador
      parameters:
        - name: setup
          in: query
          required: false
          description: "`sucesso` após a criação do administrador inicial."
          schema:
            type: string
            enum: [sucesso]
      responses:
        "200":
          $ref: "#/components/responses/Html"
    post:
      tags: [Autenticação]
      summary: Autentica um colaborador
      description: |
        Chama `new DAOColaborador().autenticar(email, senha)` (devolve `ColaboradorView`). Em sucesso invalida a sessão anterior,
        cria uma nova com `colaboradorId`, `colaboradorNome` e `nivelAcesso` e redireciona para `/admin`.
      operationId: loginColaborador
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginForm"
      responses:
        "302":
          description: Login realizado. `Location` → `/admin`.
        "400":
          description: E-mail ou senha não preenchidos. Formulário com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "401":
          description: Credenciais inválidas. Formulário com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/ErroBanco"
  /sair:
    post:
      tags: [Autenticação]
      summary: Logout (cliente ou colaborador)
      description: Servlet `LogoutServlet`. Invalida a sessão (se existir) e redireciona para `/`. `GET` retorna 405.
      operationId: logout
      responses:
        "302":
          description: "`Location` → `/`."
  /setup/admin:
    get:
      tags: [Autenticação]
      summary: Formulário de criação do administrador inicial
      description: |
        Servlet `SetupAdminServlet`. Requer a variável de ambiente `INITIAL_ADMIN_TOKEN` definida.
        Forward para `/WEB-INF/views/setup-admin.jsp`.
      operationId: formSetupAdmin
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "410":
          description: Já existe um administrador; a configuração inicial foi concluída.
        "500":
          $ref: "#/components/responses/ErroBanco"
        "503":
          description: "`INITIAL_ADMIN_TOKEN` ausente/vazio. Página com atributo `configuracaoIndisponivel=true`."
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Autenticação]
      summary: Cria o administrador inicial
      description: |
        Compara `token` com `INITIAL_ADMIN_TOKEN` em tempo constante e chama
        `DAOColaborador.criarAdministradorInicial(nome, cargo, email, senha)`.
        Em sucesso redireciona para `/colaborador/login?setup=sucesso`.
      operationId: setupAdmin
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SetupAdminForm"
      responses:
        "302":
          description: Administrador criado. `Location` → `/colaborador/login?setup=sucesso`.
        "400":
          description: Campos vazios, acima do limite ou senha com menos de 8 caracteres. Formulário com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "403":
          description: Token ausente ou inválido.
        "409":
          description: E-mail já cadastrado (SQLState `23xxx`). Formulário com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "410":
          description: Já existe um administrador (`IllegalStateException`).
        "500":
          $ref: "#/components/responses/ErroBanco"
        "503":
          description: "`INITIAL_ADMIN_TOKEN` ausente/vazio. Página com atributo `configuracaoIndisponivel=true`."
          content:
            text/html:
              schema:
                type: string

  /portal:
    get:
      tags: [Área do cliente]
      summary: Portal do cliente
      description: |
        Servlet `PortalServlet`. Com `clienteId` na sessão faz forward para `/WEB-INF/views/portal.jsp` (links para `/veiculos`,
        `/agendamentos` e botão de `POST /sair`). Com `colaboradorId` redireciona para `/admin`; sem sessão, para `/`.
      operationId: portalCliente
      security:
        - sessaoCliente: []
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          description: "`Location` → `/admin` (colaborador logado) ou `/` (sem sessão)."
  /veiculos:
    get:
      tags: [Área do cliente]
      summary: Lista os veículos do cliente
      description: |
        Servlet `VeiculoServlet`. Define o atributo `veiculos` (lista de `VeiculoCliente`) e faz forward para `/WEB-INF/views/veiculos.jsp`.
      operationId: listarVeiculos
      security:
        - sessaoCliente: []
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          $ref: "#/components/responses/RedirectLoginCliente"
        "500":
          $ref: "#/components/responses/ErroBanco"
    post:
      tags: [Área do cliente]
      summary: Adiciona ou remove um veículo do cliente
      description: |
        Campo `acao` define a operação:
        - `adicionar`: `DAOVeiculo.inserir(clienteId, placa, marca, modelo, cor)` (placa em maiúsculas);
        - `remover`: `DAOVeiculo.remover(clienteId, idVeiculo)`.
        Em sucesso redireciona para `/veiculos`. Em falha de validação reexibe a lista com atributo `erro`.
      operationId: alterarVeiculo
      security:
        - sessaoCliente: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/VeiculoForm"
      responses:
        "200":
          description: |
            Remoção não realizada (veículo inexistente ou vinculado a agendamento). Lista reexibida com atributo `erro`
            (o status permanece 200).
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Operação concluída (`Location` → `/veiculos`) ou sem sessão (`Location` → `/login`).
        "400":
          description: "`acao` inválida, ou placa/marca/modelo vazios ou acima do limite."
          content:
            text/html:
              schema:
                type: string
        "409":
          description: Placa já cadastrada ou veículo com agendamentos (SQLState `23xxx`). Lista com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/ErroBanco"
  /agendamentos:
    get:
      tags: [Área do cliente]
      summary: Agendamentos do cliente
      description: |
        Servlet `AgendamentoServlet`. Define os atributos `veiculos`, `servicos`, `agendamentos` (do cliente) e
        `dataMinima` (hoje) e faz forward para `/WEB-INF/views/agendamentos.jsp`.
      operationId: listarAgendamentos
      security:
        - sessaoCliente: []
      parameters:
        - name: sucesso
          in: query
          required: false
          description: "`1` após agendar/cancelar com sucesso."
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          $ref: "#/components/responses/RedirectLoginCliente"
        "500":
          $ref: "#/components/responses/ErroBanco"
    post:
      tags: [Área do cliente]
      summary: Cria ou cancela um agendamento
      description: |
        Campo `acao` define a operação:
        - `agendar`: valida veículo, data (não pode ser passada), horário e ao menos um serviço e chama
          `DAOAgendamento.criar(clienteId, idVeiculo, data, horario, idsServicos)`;
        - `cancelar`: `DAOAgendamento.cancelar(clienteId, idAgendamento)`.
        Em sucesso redireciona para `/agendamentos?sucesso=1`; em erro reexibe a página com atributo `erro`.
      operationId: alterarAgendamento
      security:
        - sessaoCliente: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AgendamentoForm"
            encoding:
              idServicos:
                explode: true
      responses:
        "302":
          description: Operação concluída (`Location` → `/agendamentos?sucesso=1`) ou sem sessão (`Location` → `/login`).
        "400":
          description: "`acao` inválida, data/horário mal formatados, data passada, veículo ou serviços ausentes/inválidos."
          content:
            text/html:
              schema:
                type: string
        "409":
          description: |
            Cancelamento de agendamento inexistente/não cancelável, ou veículo já agendado no mesmo dia e horário
            (SQLState `23xxx`). Página com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/ErroBanco"

  /admin/{secao}:
    get:
      tags: [Administração]
      summary: Painel do colaborador
      description: |
        Servlet `AdminServlet` (`/admin/*`). `/admin` e `/admin/` equivalem à seção `inicio`.
        Define o atributo `secao` e, conforme a seção, `servicos`, `colaboradores`, `atendimentos` (+ `colaboradores`)
        ou `pagamentos`; faz forward para `/WEB-INF/views/admin.jsp`.

        Nível mínimo por seção: `inicio`/`atendimentos` → OPERACIONAL; `pagamentos` → ATENDENTE;
        `servicos`/`colaboradores` → ADMINISTRADOR.
      operationId: painelAdmin
      security:
        - sessaoColaborador: []
      parameters:
        - $ref: "#/components/parameters/SecaoAdmin"
        - name: sucesso
          in: query
          required: false
          description: "`1` após uma operação POST bem-sucedida."
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          $ref: "#/components/responses/RedirectLoginColaborador"
        "403":
          $ref: "#/components/responses/NivelInsuficiente"
        "404":
          description: Seção desconhecida.
        "500":
          $ref: "#/components/responses/ErroBanco"
    post:
      tags: [Administração]
      summary: Executa uma operação na seção do painel
      description: |
        O corpo depende da seção (mesmos níveis mínimos do GET):
        - `servicos`: `acao=salvar` (cria se `idServico` vazio, senão atualiza) ou `acao=remover` → `ServicoForm`;
        - `colaboradores`: cadastra um colaborador → `ColaboradorForm`;
        - `atendimentos`: atualiza status e equipe do atendimento → `AtendimentoForm`;
        - `pagamentos`: registra (`PAGO`) ou cancela (`CANCELADO`) um pagamento → `PagamentoForm`.
        Em sucesso redireciona para `/admin/{secao}?sucesso=1`. A seção `inicio` não aceita POST (404).
      operationId: operacaoAdmin
      security:
        - sessaoColaborador: []
      parameters:
        - $ref: "#/components/parameters/SecaoAdmin"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ServicoForm"
                - $ref: "#/components/schemas/ColaboradorForm"
                - $ref: "#/components/schemas/AtendimentoForm"
                - $ref: "#/components/schemas/PagamentoForm"
            encoding:
              idColaboradores:
                explode: true
      responses:
        "302":
          description: |
            Operação concluída (`Location` → `/admin/{secao}?sucesso=1`) ou sem sessão (`Location` → `/colaborador/login`).
        "400":
          description: Dados inválidos (`IllegalArgumentException`). Painel reexibido com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/NivelInsuficiente"
        "404":
          description: Seção desconhecida ou `inicio`.
        "409":
          description: Violação de restrição (e-mail duplicado ou registro em uso, SQLState `23xxx`). Painel com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/ErroBanco"

  /cadastro:
    get:
      tags: [Clientes]
      summary: Formulário de cadastro de cliente
      description: |
        Servlet `CadastroClienteServlet` (única rota de cadastro; a servlet legada `Cadastro` e a rota
        `/cadastroServlet` foram removidas). Forward para `/cadastro.jsp`.
      operationId: formCadastroCliente
      responses:
        "200":
          $ref: "#/components/responses/Html"
    post:
      tags: [Clientes]
      summary: Cadastra um novo cliente
      description: |
        Servlet `CadastroClienteServlet`. Confere a senha (mín. 8), monta `model.Cliente` (o construtor valida e
        normaliza os campos via `Validacao`), gera o hash com `Passwords.hash` e chama `DAOCliente.insertUsuario`.
        Em sucesso redireciona para `/baixar-app` (Post/Redirect/Get); em erro faz forward para `/cadastro.jsp` com
        atributo `erro`.
      operationId: cadastrarCliente
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CadastroClienteForm"
      responses:
        "302":
          description: Cliente cadastrado. `Location` → `/baixar-app`.
        "400":
          description: |
            Mensagem de `Validacao`: campo vazio, nome > 100, CPF sem 11 dígitos, telefone sem 10 ou 11 dígitos,
            e-mail inválido ou > 150, ou senha < 8 caracteres. Formulário com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "409":
          description: CPF ou e-mail já cadastrado (SQLState `23xxx`). Formulário com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/ErroBanco"

  /baixar-app:
    get:
      tags: [Clientes]
      summary: Tela de baixar o app, após o cadastro
      description: |
        Servlet `BaixarAppServlet`. Forward para `/WEB-INF/views/baixar-app.jsp`. Destino do redirect de
        `POST /cadastro`, para que recarregar a página não reenvie o formulário. Rota pública.
      operationId: baixarApp
      responses:
        "200":
          $ref: "#/components/responses/Html"
  /api/v1/auth/login:
    post:
      tags: [API mobile]
      summary: Login do cliente no app
      description: |
        `AuthApiServlet`. Confere a senha (BCrypt) e abre a sessão (`clienteId`); o cookie `JSESSIONID` vem no `Set-Cookie`
        e o app deve reenviá-lo. Descarta a sessão anterior. A mensagem 401 é única (não revela se o e-mail existe).
      operationId: apiLogin
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiLoginRequest"
      responses:
        "200":
          description: Login ok.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cliente:
                    $ref: "#/components/schemas/ApiCliente"
        "400":
          description: Corpo inválido ou e-mail/senha vazios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "401":
          description: E-mail ou senha inválidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "500":
          description: Erro de banco (mensagem genérica; detalhe no log do servidor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
  /api/v1/servicos:
    get:
      tags: [API mobile]
      summary: Lista os serviços ativos
      description: |
        `ServicoApiServlet`. Rota pública.
      operationId: apiServicos
      security:
        - {}
      responses:
        "200":
          description: Serviços.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiServico"
        "500":
          description: Erro de banco (mensagem genérica; detalhe no log do servidor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
  /api/v1/veiculos:
    get:
      tags: [API mobile]
      summary: Lista os veículos do cliente logado
      description: |
        `VeiculoApiServlet`.
      operationId: apiVeiculosListar
      security:
        - sessaoCliente: []
      responses:
        "200":
          description: Veículos (`[]` se não houver).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiVeiculo"
        "401":
          description: Sem sessão de cliente (`Faça login para continuar`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "500":
          description: Erro de banco (mensagem genérica; detalhe no log do servidor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
    post:
      tags: [API mobile]
      summary: Cadastra um veículo
      description: |
        `VeiculoApiServlet`. A placa é normalizada (maiúsculas). `cor` é opcional.
      operationId: apiVeiculosCriar
      security:
        - sessaoCliente: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiNovoVeiculo"
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVeiculo"
        "400":
          description: Corpo vazio/inválido ou campo obrigatório ausente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "401":
          description: Sem sessão de cliente (`Faça login para continuar`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "409":
          description: Placa já cadastrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "422":
          description: Regra da DAO (cliente inativo/inexistente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "500":
          description: Erro de banco (mensagem genérica; detalhe no log do servidor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
  /api/v1/veiculos/{idVeiculo}:
    patch:
      tags: [API mobile]
      summary: Atualiza parcialmente um veículo do cliente logado
      description: |
        `VeiculoApiServlet`. Campo ausente mantém o valor atual; `cor` vazia ou `null` apaga a cor.
      operationId: apiVeiculosAtualizar
      security:
        - sessaoCliente: []
      parameters:
        - name: idVeiculo
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                placa: {type: string}
                marca: {type: string}
                modelo: {type: string}
                cor: {type: string, nullable: true}
      responses:
        "200":
          description: Veículo atualizado (`id_veiculo`, `placa`, `marca`, `modelo`, `cor`).
        "400":
          description: Caminho ou corpo inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "401":
          description: Sem sessão de cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "404":
          description: Veículo não encontrado para este cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "409":
          description: Placa já cadastrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "422":
          description: Placa inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
    delete:
      tags: [API mobile]
      summary: Exclui um veículo do cliente logado
      description: |
        `VeiculoApiServlet`.
      operationId: apiVeiculosExcluir
      security:
        - sessaoCliente: []
      parameters:
        - name: idVeiculo
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Excluído.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMensagem"
        "400":
          description: Identificador inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "401":
          description: Sem sessão de cliente (`Faça login para continuar`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "404":
          description: Veículo não encontrado para este cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "500":
          description: Erro de banco (mensagem genérica; detalhe no log do servidor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
  /api/v1/agendamentos:
    get:
      tags: [API mobile]
      summary: Lista os agendamentos do cliente logado
      description: |
        `AgendamentoApiServlet`. Datas em ISO `yyyy-MM-dd` (listagem, `POST` e `GET /horarios`). Inclui `status` do agendamento e `status_atendimento` (etapa da lavagem).
      operationId: apiAgendamentosListar
      security:
        - sessaoCliente: []
      responses:
        "200":
          description: Agendamentos (`[]` se não houver).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiAgendamento"
        "401":
          description: Sem sessão de cliente (`Faça login para continuar`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "500":
          description: Erro de banco (mensagem genérica; detalhe no log do servidor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
    post:
      tags: [API mobile]
      summary: Cria um agendamento
      description: |
        `AgendamentoApiServlet` → `DAOAgendamento.criar`. Grade de 06:00 a 17:30, de 30 em 30 minutos, um agendamento por horário
        (ver `GET /api/v1/horarios`). Horário fora da grade, em data/hora passada ou já ocupado → 422.
      operationId: apiAgendamentosCriar
      security:
        - sessaoCliente: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiNovoAgendamento"
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMensagem"
        "400":
          description: Corpo inválido, campo ausente ou data fora de `yyyy-MM-dd`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "401":
          description: Sem sessão de cliente (`Faça login para continuar`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "422":
          description: Regra de negócio (veículo inativo/de outro cliente, serviço inexistente/repetido, horário fora da grade, passado ou indisponível).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "500":
          description: Erro de banco (mensagem genérica; detalhe no log do servidor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
  /api/v1/agendamentos/{idAgendamento}/cancelar:
    post:
      tags: [API mobile]
      summary: Cancela um agendamento do cliente logado
      description: |
        `AgendamentoApiServlet` → `DAOAgendamento.cancelar`. Só cancela se for do cliente e estiver `AGENDADO`; o pagamento pendente vira `CANCELADO`. Sem corpo.
      operationId: apiAgendamentosCancelar
      security:
        - sessaoCliente: []
      parameters:
        - name: idAgendamento
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMensagem"
        "400":
          description: Caminho inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "401":
          description: Sem sessão de cliente (`Faça login para continuar`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "404":
          description: Inexistente, de outro cliente ou fora do status `AGENDADO` (mesma resposta nos três casos).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "500":
          description: Erro de banco (mensagem genérica; detalhe no log do servidor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
  /api/v1/agendamentos/{idAgendamento}/pagar:
    post:
      tags: [API mobile]
      summary: Cliente paga o agendamento pelo app
      description: |
        `AgendamentoApiServlet`. Confere que o agendamento é do cliente da sessão e chama
        `DAOPagamento.atualizar(id, "PAGO", forma)`. O atendente também pode marcar como pago no painel
        (`/admin/pagamentos`); os dois gravam na mesma linha de `pagamento`, então `status_pagamento` e
        `forma_pagamento` do `GET /agendamentos` refletem qualquer um. Só o primeiro vale: o segundo recebe 409.
      operationId: apiAgendamentosPagar
      security:
        - sessaoCliente: []
      parameters:
        - name: idAgendamento
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [forma]
              properties:
                forma:
                  type: string
                  enum: [PIX, CREDITO, DEBITO]
                  description: "`DINHEIRO` só o atendente registra no painel."
      responses:
        "200":
          description: Pago (`mensagem`, `status_pagamento` = PAGO, `forma_pagamento`).
        "400":
          description: Caminho ou corpo inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "401":
          description: Sem sessão de cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "404":
          description: Agendamento inexistente ou de outro cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "409":
          description: Pagamento já processado (pago ou cancelado) ou agendamento cancelado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "422":
          description: Forma de pagamento inválida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
  /api/v1/horarios:
    get:
      tags: [API mobile]
      summary: Horários livres de uma data
      description: |
        `HorarioApiServlet`. Grade 06:00–17:30 de 30 em 30 min menos os ocupados (agendamentos não cancelados). Data passada → `[]`; hoje → só os que ainda não passaram.
      operationId: apiHorarios
      security:
        - sessaoCliente: []
      parameters:
        - name: data
          in: query
          required: true
          description: Data no formato `yyyy-MM-dd`.
          schema:
            type: string
            example: 20/10/2026
      responses:
        "200":
          description: Horários livres em `HH:mm`.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: "06:30"
        "400":
          description: '`data` ausente ou inválida.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "401":
          description: Sem sessão de cliente (`Faça login para continuar`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "500":
          description: Erro de banco (mensagem genérica; detalhe no log do servidor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
  /api/v1/usuarios:
    get:
      tags: [API mobile]
      summary: Dados do cliente logado
      description: |
        `ClienteApiServlet`.
      operationId: apiUsuarioConsultar
      security:
        - sessaoCliente: []
      responses:
        "200":
          description: Cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiCliente"
        "401":
          description: Sem sessão de cliente (`Faça login para continuar`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "404":
          description: Cliente não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "500":
          description: Erro de banco (mensagem genérica; detalhe no log do servidor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
    patch:
      tags: [API mobile]
      summary: Atualiza nome, telefone e e-mail do cliente logado
      description: |
        `ClienteApiServlet`. Campos ausentes não são alterados; os setters de `Cliente` validam (`Validacao`).
      operationId: apiUsuarioAtualizar
      security:
        - sessaoCliente: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiAtualizarPerfil"
      responses:
        "200":
          description: Cliente atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiCliente"
        "400":
          description: Corpo vazio ou inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "401":
          description: Sem sessão de cliente (`Faça login para continuar`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "404":
          description: Cliente não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "422":
          description: Valor rejeitado pela validação (nome, telefone ou e-mail).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
        "500":
          description: Erro de banco (mensagem genérica; detalhe no log do servidor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErro"
components:
  securitySchemes:
    sessaoCliente:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessão com o atributo `clienteId` (criada por `POST /login`).
    sessaoColaborador:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessão com `colaboradorId` e `nivelAcesso` (criada por `POST /colaborador/login`).
  parameters:
    CadastroQuery:
      name: cadastro
      in: query
      required: false
      description: "`sucesso` após `POST /cadastro`; exibe a mensagem de cadastro realizado."
      schema:
        type: string
        enum: [sucesso]
    SecaoAdmin:
      name: secao
      in: path
      required: true
      description: Seção do painel. `/admin` (sem seção) equivale a `inicio`.
      schema:
        type: string
        enum: [inicio, atendimentos, pagamentos, servicos, colaboradores]
  responses:
    Html:
      description: Página HTML.
      content:
        text/html:
          schema:
            type: string
    IndexHtml:
      description: Página HTML com o formulário de cadastro e os links das telas de teste.
      content:
        text/html:
          schema:
            type: string
    RedirectLoginCliente:
      description: Sem cliente na sessão. `Location` → `/login`.
    RedirectLoginColaborador:
      description: Sem colaborador na sessão. `Location` → `/colaborador/login`.
    NivelInsuficiente:
      description: Colaborador logado com nível de acesso abaixo do exigido pela seção.
    ErroBanco:
      description: Falha de banco (`WebSupport.erroBanco`). Forward para `/WEB-INF/views/erro.jsp` com atributo `mensagem`.
      content:
        text/html:
          schema:
            type: string
    ErroInterno:
      description: Erro não tratado (`SQLException`/`RuntimeException`) — página de erro padrão do Tomcat.
      content:
        text/html:
          schema:
            type: string
  schemas:
    LoginForm:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
    SetupAdminForm:
      type: object
      description: Campos de `WEB-INF/views/setup-admin.jsp`.
      required: [token, nome, cargo, email, senha]
      properties:
        token:
          type: string
          format: password
          description: Deve ser igual à variável de ambiente `INITIAL_ADMIN_TOKEN`.
        nome:
          type: string
          maxLength: 100
        cargo:
          type: string
          maxLength: 60
        email:
          type: string
          format: email
          maxLength: 150
        senha:
          type: string
          format: password
          minLength: 8
    CadastroClienteForm:
      type: object
      description: Campos aceitos por `POST /cadastro`, com os nomes do formulário de `cadastro.jsp` (aparados com `trim`, exceto `pass`).
      required: [name, cpf, phone, email, pass]
      properties:
        name:
          type: string
          maxLength: 100
        cpf:
          type: string
          description: Caracteres não numéricos são removidos; deve restar exatamente 11 dígitos.
          example: "123.456.789-01"
        phone:
          type: string
          description: Caracteres não numéricos são removidos; deve restar 10 ou 11 dígitos (DDD + número).
          example: "(11) 98765-4321"
        email:
          type: string
          format: email
          maxLength: 150
        pass:
          type: string
          format: password
          minLength: 8
    VeiculoForm:
      type: object
      description: Campos de `WEB-INF/views/veiculos.jsp`.
      required: [acao]
      properties:
        acao:
          type: string
          enum: [adicionar, remover]
        idVeiculo:
          type: integer
          description: Obrigatório para `remover`.
        placa:
          type: string
          maxLength: 10
          description: Obrigatório para `adicionar`; convertida para maiúsculas.
        marca:
          type: string
          maxLength: 60
          description: Obrigatório para `adicionar`.
        modelo:
          type: string
          maxLength: 60
          description: Obrigatório para `adicionar`.
        cor:
          type: string
          maxLength: 30
    AgendamentoForm:
      type: object
      description: Campos de `WEB-INF/views/agendamentos.jsp`.
      required: [acao]
      properties:
        acao:
          type: string
          enum: [agendar, cancelar]
        idAgendamento:
          type: integer
          description: Obrigatório para `cancelar`.
        idVeiculo:
          type: integer
          description: Obrigatório para `agendar`.
        data:
          type: string
          format: date
          description: Obrigatório para `agendar`; não pode ser anterior a hoje.
        horario:
          type: string
          pattern: "^\\d{2}:\\d{2}(:\\d{2})?$"
          example: "14:30"
          description: Obrigatório para `agendar` (`LocalTime.parse`).
        idServicos:
          type: array
          description: Obrigatório para `agendar`; ao menos um ID positivo (parâmetro repetido).
          items:
            type: integer
            minimum: 1
    ServicoForm:
      type: object
      description: "`POST /admin/servicos` (ADMINISTRADOR)."
      required: [acao]
      properties:
        acao:
          type: string
          enum: [salvar, remover]
        idServico:
          type: integer
          description: Obrigatório para `remover`; em `salvar`, vazio cria e preenchido atualiza.
        nome:
          type: string
          maxLength: 100
          description: Obrigatório para `salvar`.
        descricao:
          type: string
          maxLength: 255
        preco:
          type: string
          description: Obrigatório para `salvar`. Decimal ≥ 0, até 10 dígitos e 2 casas; aceita vírgula.
          example: "49,90"
    ColaboradorForm:
      type: object
      description: "`POST /admin/colaboradores` (ADMINISTRADOR)."
      required: [nome, cargo, email, senha, nivelAcesso]
      properties:
        nome:
          type: string
          maxLength: 100
        cargo:
          type: string
          maxLength: 60
        email:
          type: string
          format: email
          maxLength: 150
        senha:
          type: string
          format: password
          minLength: 8
        nivelAcesso:
          $ref: "#/components/schemas/NivelAcesso"
    AtendimentoForm:
      type: object
      description: "`POST /admin/atendimentos` (OPERACIONAL ou superior)."
      required: [idAtendimento, status]
      properties:
        idAtendimento:
          type: integer
        status:
          type: string
          enum: [AGUARDANDO, EM_LAVAGEM, FINALIZADO, ENTREGUE]
        idColaboradores:
          type: array
          description: Colaboradores responsáveis (parâmetro repetido; IDs positivos).
          items:
            type: integer
            minimum: 1
    PagamentoForm:
      type: object
      description: "`POST /admin/pagamentos` (ATENDENTE ou superior)."
      required: [idPagamento, status]
      properties:
        idPagamento:
          type: integer
        status:
          type: string
          enum: [PAGO, CANCELADO]
        formaPagamento:
          type: string
          description: Obrigatório quando `status=PAGO`.
          enum: [DINHEIRO, PIX, CREDITO, DEBITO]
    NivelAcesso:
      type: string
      enum: [OPERACIONAL, ATENDENTE, ADMINISTRADOR]
    VeiculoCliente:
      type: object
      description: DTO `model.dto.VeiculoView` (atributo `veiculos` em `/veiculos` e `/agendamentos`).
      properties:
        id:
          type: integer
        placa:
          type: string
        marca:
          type: string
        modelo:
          type: string
        cor:
          type: string
    ApiErro:
      type: object
      required: [erro]
      properties:
        erro:
          type: string
    ApiMensagem:
      type: object
      properties:
        mensagem:
          type: string
    ApiLoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
    ApiCliente:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          nullable: true
        cpf:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
    ApiAtualizarPerfil:
      type: object
      description: Todos os campos são opcionais; ausente = não altera.
      properties:
        nome:
          type: string
        telefone:
          type: string
        email:
          type: string
    ApiServico:
      type: object
      properties:
        id_servico:
          type: integer
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        preco:
          type: number
    ApiVeiculo:
      type: object
      properties:
        id_veiculo:
          type: integer
        placa:
          type: string
        marca:
          type: string
        modelo:
          type: string
        cor:
          type: string
          nullable: true
    ApiNovoVeiculo:
      type: object
      required: [placa, marca, modelo]
      properties:
        placa:
          type: string
        marca:
          type: string
        modelo:
          type: string
        cor:
          type: string
          nullable: true
    ApiAgendamento:
      type: object
      properties:
        id_agendamento:
          type: integer
        id_veiculo:
          type: integer
        data_agendamento:
          type: string
          example: 2026-10-20
          description: Formato `yyyy-MM-dd`.
        hora_agendamento:
          type: string
          example: "10:00:00"
        id_servico:
          type: array
          items:
            type: integer
        servicos:
          type: array
          description: Serviços do agendamento com o `valor` praticado na época (não o preço atual do catálogo); a soma dos `valor` é `total_servico`.
          items:
            type: object
            properties:
              id_servico:
                type: integer
              nome:
                type: string
              valor:
                type: number
        total_servico:
          type: number
        status:
          type: string
          enum: [AGENDADO, CANCELADO, CONCLUIDO]
        status_atendimento:
          type: string
          nullable: true
          enum: [AGUARDANDO, EM_LAVAGEM, FINALIZADO, ENTREGUE]
          description: Etapa da lavagem; `null` se o agendamento não tem atendimento.
        status_pagamento:
          type: string
          nullable: true
        forma_pagamento:
          type: string
          nullable: true
    ApiNovoAgendamento:
      type: object
      required: [idveiculo, dataAgendamento, horarioAgendamento, idservico]
      properties:
        idveiculo:
          type: integer
        dataAgendamento:
          type: string
          example: 2026-10-20
          description: Formato `yyyy-MM-dd`.
        horarioAgendamento:
