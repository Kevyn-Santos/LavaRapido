openapi: 3.0.3
info:
  title: SplashFast
  version: "1.1"
  description: |
    Documentação das rotas HTTP da aplicação web SplashFast (Jakarta Servlets + JSP, Tomcat 10).

    Observações gerais:
    - Não há `web.xml`; todas as rotas vêm de `@WebServlet` e de JSPs públicas (fora de `WEB-INF`).
    - `EncodingFilter` (`@WebFilter("/*")`) força UTF-8 em todas as requisições e respostas.
    - As rotas renderizam HTML (forward para JSP) ou redirecionam (302); não há API JSON.
    - Os formulários enviam `application/x-www-form-urlencoded`.
    - Autenticação por sessão HTTP (cookie `JSESSIONID`):
      - cliente: `POST /login` grava `clienteId`/`clienteNome` na sessão;
      - colaborador: `POST /colaborador/login` grava `colaboradorId`/`colaboradorNome`/`nivelAcesso`.
      Rotas de cliente sem sessão redirecionam para `/login`; rotas de colaborador sem sessão redirecionam
      para `/colaborador/login` e, com nível insuficiente, retornam 403.
    - Hierarquia de níveis: `ADMINISTRADOR` (3) > `ATENDENTE` (2) > `OPERACIONAL` (1).
    - Erros de banco tratados por `WebSupport.erroBanco` respondem 500 com forward para `/WEB-INF/views/erro.jsp` (atributo `mensagem`).
      Erros não tratados (`RuntimeException`) resultam na página de erro padrão do Tomcat (HTTP 500).
servers:
  - url: http://{host}:{port}/{contextPath}
    description: Tomcat local (o build.sh publica target/SplashFast-1.0.war em /var/lib/tomcat10/webapps)
    variables:
      host:
        default: localhost
      port:
        default: "8080"
      contextPath:
        default: SplashFast-1.0
        description: Nome do WAR implantado (artifactId-version, sem finalName no pom.xml).
security:
  - {}
tags:
  - name: Páginas
    description: JSPs acessíveis diretamente
  - name: Autenticação
    description: Login/logout de clientes e colaboradores e configuração do administrador inicial
  - name: Área do cliente
    description: Portal, veículos e agendamentos do cliente autenticado
  - name: Administração
    description: Painel de colaboradores (serviços, equipe, atendimentos, pagamentos)
  - name: Clientes
    description: Cadastro de clientes
paths:
  /:
    get:
      tags: [Páginas]
      summary: Página inicial (welcome file index.jsp)
      description: Equivalente a `GET /index.jsp`.
      operationId: paginaInicial
      responses:
        "200":
          $ref: "#/components/responses/IndexHtml"
  /index.jsp:
    get:
      tags: [Páginas]
      summary: Página inicial (landing)
      description: |
        Landing page com os serviços e links para `/cadastro` ("Criar conta") e `/colaborador/login`
        ("Acesso da equipe").
      operationId: indexJsp
      responses:
        "200":
          $ref: "#/components/responses/IndexHtml"
  /cadastro.jsp:
    get:
      tags: [Páginas]
      summary: Formulário de cadastro de cliente (novo layout)
      description: |
        Formulário com nome, CPF, telefone, e-mail e senha (mín. 8) e link para `/login`.
        O `action` aponta para `POST /cadastro` (`CadastroClienteServlet`). Também é a view de `GET /cadastro`.
      operationId: cadastroJsp
      responses:
        "200":
          $ref: "#/components/responses/Html"
  /health.jsp:
    get:
      tags: [Páginas]
      summary: Health check
      description: Página estática com o texto `OK`.
      operationId: healthCheck
      responses:
        "200":
          $ref: "#/components/responses/Html"

  /login:
    get:
      tags: [Autenticação]
      summary: Formulário de login do cliente
      description: Servlet `LoginServlet`. Forward para `/WEB-INF/views/login.jsp`.
      operationId: formLoginCliente
      parameters:
        - $ref: "#/components/parameters/CadastroQuery"
      responses:
        "200":
          $ref: "#/components/responses/Html"
    post:
      tags: [Autenticação]
      summary: Autentica um cliente
      description: |
        Chama `new DAOCliente().autenticar(email, senha)` (devolve `ClienteView`). Em sucesso invalida a sessão anterior, cria uma nova com
        `clienteId` e `clienteNome` e redireciona para `/portal`.
      operationId: loginCliente
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginForm"
      responses:
        "302":
          description: Login realizado. `Location` → `/portal`.
        "400":
          description: E-mail ou senha não preenchidos. Forward para `/WEB-INF/views/login.jsp` com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "401":
          description: Credenciais inválidas. Forward para `/WEB-INF/views/login.jsp` com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/ErroBanco"
  /colaborador/login:
    get:
      tags: [Autenticação]
      summary: Formulário de login de colaborador
      description: Servlet `ColaboradorLoginServlet`. Forward para `/WEB-INF/views/colaborador-login.jsp`.
      operationId: formLoginColaborador
      parameters:
        - name: setup
          in: query
          required: false
          description: "`sucesso` após a criação do administrador inicial."
          schema:
            type: string
            enum: [sucesso]
      responses:
        "200":
          $ref: "#/components/responses/Html"
    post:
      tags: [Autenticação]
      summary: Autentica um colaborador
      description: |
        Chama `new DAOColaborador().autenticar(email, senha)` (devolve `ColaboradorView`). Em sucesso invalida a sessão anterior,
        cria uma nova com `colaboradorId`, `colaboradorNome` e `nivelAcesso` e redireciona para `/admin`.
      operationId: loginColaborador
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/LoginForm"
      responses:
        "302":
          description: Login realizado. `Location` → `/admin`.
        "400":
          description: E-mail ou senha não preenchidos. Formulário com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "401":
          description: Credenciais inválidas. Formulário com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/ErroBanco"
  /sair:
    post:
      tags: [Autenticação]
      summary: Logout (cliente ou colaborador)
      description: Servlet `LogoutServlet`. Invalida a sessão (se existir) e redireciona para `/`. `GET` retorna 405.
      operationId: logout
      responses:
        "302":
          description: "`Location` → `/`."
  /setup/admin:
    get:
      tags: [Autenticação]
      summary: Formulário de criação do administrador inicial
      description: |
        Servlet `SetupAdminServlet`. Requer a variável de ambiente `INITIAL_ADMIN_TOKEN` definida.
        Forward para `/WEB-INF/views/setup-admin.jsp`.
      operationId: formSetupAdmin
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "410":
          description: Já existe um administrador; a configuração inicial foi concluída.
        "500":
          $ref: "#/components/responses/ErroBanco"
        "503":
          description: "`INITIAL_ADMIN_TOKEN` ausente/vazio. Página com atributo `configuracaoIndisponivel=true`."
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [Autenticação]
      summary: Cria o administrador inicial
      description: |
        Compara `token` com `INITIAL_ADMIN_TOKEN` em tempo constante e chama
        `DAOColaborador.criarAdministradorInicial(nome, cargo, email, senha)`.
        Em sucesso redireciona para `/colaborador/login?setup=sucesso`.
      operationId: setupAdmin
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SetupAdminForm"
      responses:
        "302":
          description: Administrador criado. `Location` → `/colaborador/login?setup=sucesso`.
        "400":
          description: Campos vazios, acima do limite ou senha com menos de 8 caracteres. Formulário com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "403":
          description: Token ausente ou inválido.
        "409":
          description: E-mail já cadastrado (SQLState `23xxx`). Formulário com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "410":
          description: Já existe um administrador (`IllegalStateException`).
        "500":
          $ref: "#/components/responses/ErroBanco"
        "503":
          description: "`INITIAL_ADMIN_TOKEN` ausente/vazio. Página com atributo `configuracaoIndisponivel=true`."
          content:
            text/html:
              schema:
                type: string

  /portal:
    get:
      tags: [Área do cliente]
      summary: Portal do cliente
      description: |
        Servlet `PortalServlet`. Com `clienteId` na sessão faz forward para `/WEB-INF/views/portal.jsp` (links para `/veiculos`,
        `/agendamentos` e botão de `POST /sair`). Com `colaboradorId` redireciona para `/admin`; sem sessão, para `/`.
      operationId: portalCliente
      security:
        - sessaoCliente: []
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          description: "`Location` → `/admin` (colaborador logado) ou `/` (sem sessão)."
  /veiculos:
    get:
      tags: [Área do cliente]
      summary: Lista os veículos do cliente
      description: |
        Servlet `VeiculoServlet`. Define o atributo `veiculos` (lista de `VeiculoCliente`) e faz forward para `/WEB-INF/views/veiculos.jsp`.
      operationId: listarVeiculos
      security:
        - sessaoCliente: []
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          $ref: "#/components/responses/RedirectLoginCliente"
        "500":
          $ref: "#/components/responses/ErroBanco"
    post:
      tags: [Área do cliente]
      summary: Adiciona ou remove um veículo do cliente
      description: |
        Campo `acao` define a operação:
        - `adicionar`: `DAOVeiculo.inserir(clienteId, placa, marca, modelo, cor)` (placa em maiúsculas);
        - `remover`: `DAOVeiculo.remover(clienteId, idVeiculo)`.
        Em sucesso redireciona para `/veiculos`. Em falha de validação reexibe a lista com atributo `erro`.
      operationId: alterarVeiculo
      security:
        - sessaoCliente: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/VeiculoForm"
      responses:
        "200":
          description: |
            Remoção não realizada (veículo inexistente ou vinculado a agendamento). Lista reexibida com atributo `erro`
            (o status permanece 200).
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Operação concluída (`Location` → `/veiculos`) ou sem sessão (`Location` → `/login`).
        "400":
          description: "`acao` inválida, ou placa/marca/modelo vazios ou acima do limite."
          content:
            text/html:
              schema:
                type: string
        "409":
          description: Placa já cadastrada ou veículo com agendamentos (SQLState `23xxx`). Lista com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/ErroBanco"
  /agendamentos:
    get:
      tags: [Área do cliente]
      summary: Agendamentos do cliente
      description: |
        Servlet `AgendamentoServlet`. Define os atributos `veiculos`, `servicos`, `agendamentos` (do cliente) e
        `dataMinima` (hoje) e faz forward para `/WEB-INF/views/agendamentos.jsp`.
      operationId: listarAgendamentos
      security:
        - sessaoCliente: []
      parameters:
        - name: sucesso
          in: query
          required: false
          description: "`1` após agendar/cancelar com sucesso."
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          $ref: "#/components/responses/RedirectLoginCliente"
        "500":
          $ref: "#/components/responses/ErroBanco"
    post:
      tags: [Área do cliente]
      summary: Cria ou cancela um agendamento
      description: |
        Campo `acao` define a operação:
        - `agendar`: valida veículo, data (não pode ser passada), horário e ao menos um serviço e chama
          `DAOAgendamento.criar(clienteId, idVeiculo, data, horario, idsServicos)`;
        - `cancelar`: `DAOAgendamento.cancelar(clienteId, idAgendamento)`.
        Em sucesso redireciona para `/agendamentos?sucesso=1`; em erro reexibe a página com atributo `erro`.
      operationId: alterarAgendamento
      security:
        - sessaoCliente: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/AgendamentoForm"
            encoding:
              idServicos:
                explode: true
      responses:
        "302":
          description: Operação concluída (`Location` → `/agendamentos?sucesso=1`) ou sem sessão (`Location` → `/login`).
        "400":
          description: "`acao` inválida, data/horário mal formatados, data passada, veículo ou serviços ausentes/inválidos."
          content:
            text/html:
              schema:
                type: string
        "409":
          description: |
            Cancelamento de agendamento inexistente/não cancelável, ou veículo já agendado no mesmo dia e horário
            (SQLState `23xxx`). Página com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/ErroBanco"

  /admin/{secao}:
    get:
      tags: [Administração]
      summary: Painel do colaborador
      description: |
        Servlet `AdminServlet` (`/admin/*`). `/admin` e `/admin/` equivalem à seção `inicio`.
        Define o atributo `secao` e, conforme a seção, `servicos`, `colaboradores`, `atendimentos` (+ `colaboradores`)
        ou `pagamentos`; faz forward para `/WEB-INF/views/admin.jsp`.

        Nível mínimo por seção: `inicio`/`atendimentos` → OPERACIONAL; `pagamentos` → ATENDENTE;
        `servicos`/`colaboradores` → ADMINISTRADOR.
      operationId: painelAdmin
      security:
        - sessaoColaborador: []
      parameters:
        - $ref: "#/components/parameters/SecaoAdmin"
        - name: sucesso
          in: query
          required: false
          description: "`1` após uma operação POST bem-sucedida."
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          $ref: "#/components/responses/Html"
        "302":
          $ref: "#/components/responses/RedirectLoginColaborador"
        "403":
          $ref: "#/components/responses/NivelInsuficiente"
        "404":
          description: Seção desconhecida.
        "500":
          $ref: "#/components/responses/ErroBanco"
    post:
      tags: [Administração]
      summary: Executa uma operação na seção do painel
      description: |
        O corpo depende da seção (mesmos níveis mínimos do GET):
        - `servicos`: `acao=salvar` (cria se `idServico` vazio, senão atualiza) ou `acao=remover` → `ServicoForm`;
        - `colaboradores`: cadastra um colaborador → `ColaboradorForm`;
        - `atendimentos`: atualiza status e equipe do atendimento → `AtendimentoForm`;
        - `pagamentos`: registra (`PAGO`) ou cancela (`CANCELADO`) um pagamento → `PagamentoForm`.
        Em sucesso redireciona para `/admin/{secao}?sucesso=1`. A seção `inicio` não aceita POST (404).
      operationId: operacaoAdmin
      security:
        - sessaoColaborador: []
      parameters:
        - $ref: "#/components/parameters/SecaoAdmin"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ServicoForm"
                - $ref: "#/components/schemas/ColaboradorForm"
                - $ref: "#/components/schemas/AtendimentoForm"
                - $ref: "#/components/schemas/PagamentoForm"
            encoding:
              idColaboradores:
                explode: true
      responses:
        "302":
          description: |
            Operação concluída (`Location` → `/admin/{secao}?sucesso=1`) ou sem sessão (`Location` → `/colaborador/login`).
        "400":
          description: Dados inválidos (`IllegalArgumentException`). Painel reexibido com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/NivelInsuficiente"
        "404":
          description: Seção desconhecida ou `inicio`.
        "409":
          description: Violação de restrição (e-mail duplicado ou registro em uso, SQLState `23xxx`). Painel com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/ErroBanco"

  /cadastro:
    get:
      tags: [Clientes]
      summary: Formulário de cadastro de cliente
      description: |
        Servlet `CadastroClienteServlet` (única rota de cadastro; a servlet legada `Cadastro` e a rota
        `/cadastroServlet` foram removidas). Forward para `/cadastro.jsp`.
      operationId: formCadastroCliente
      responses:
        "200":
          $ref: "#/components/responses/Html"
    post:
      tags: [Clientes]
      summary: Cadastra um novo cliente
      description: |
        Servlet `CadastroClienteServlet`. Confere a senha (mín. 8), monta `model.Cliente` (o construtor valida e
        normaliza os campos via `Validacao`), gera o hash com `Passwords.hash` e chama `DAOCliente.insertUsuario`.
        Em sucesso redireciona para `/login?cadastro=sucesso`; em erro faz forward para `/cadastro.jsp` com atributo
        `erro` (os campos digitados, exceto a senha, voltam preenchidos).
      operationId: cadastrarCliente
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CadastroClienteForm"
      responses:
        "302":
          description: Cliente cadastrado. `Location` → `/login?cadastro=sucesso`.
        "400":
          description: |
            Mensagem de `Validacao`: campo vazio, nome > 100, CPF sem 11 dígitos, telefone sem 10 ou 11 dígitos,
            e-mail inválido ou > 150, ou senha < 8 caracteres. Formulário com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "409":
          description: CPF ou e-mail já cadastrado (SQLState `23xxx`). Formulário com atributo `erro`.
          content:
            text/html:
              schema:
                type: string
        "500":
          $ref: "#/components/responses/ErroBanco"
components:
  securitySchemes:
    sessaoCliente:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessão com o atributo `clienteId` (criada por `POST /login`).
    sessaoColaborador:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessão com `colaboradorId` e `nivelAcesso` (criada por `POST /colaborador/login`).
  parameters:
    CadastroQuery:
      name: cadastro
      in: query
      required: false
      description: "`sucesso` após `POST /cadastro`; exibe a mensagem de cadastro realizado."
      schema:
        type: string
        enum: [sucesso]
    SecaoAdmin:
      name: secao
      in: path
      required: true
      description: Seção do painel. `/admin` (sem seção) equivale a `inicio`.
      schema:
        type: string
        enum: [inicio, atendimentos, pagamentos, servicos, colaboradores]
  responses:
    Html:
      description: Página HTML.
      content:
        text/html:
          schema:
            type: string
    IndexHtml:
      description: Página HTML com o formulário de cadastro e os links das telas de teste.
      content:
        text/html:
          schema:
            type: string
    RedirectLoginCliente:
      description: Sem cliente na sessão. `Location` → `/login`.
    RedirectLoginColaborador:
      description: Sem colaborador na sessão. `Location` → `/colaborador/login`.
    NivelInsuficiente:
      description: Colaborador logado com nível de acesso abaixo do exigido pela seção.
    ErroBanco:
      description: Falha de banco (`WebSupport.erroBanco`). Forward para `/WEB-INF/views/erro.jsp` com atributo `mensagem`.
      content:
        text/html:
          schema:
            type: string
    ErroInterno:
      description: Erro não tratado (`SQLException`/`RuntimeException`) — página de erro padrão do Tomcat.
      content:
        text/html:
          schema:
            type: string
  schemas:
    LoginForm:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
    SetupAdminForm:
      type: object
      description: Campos de `WEB-INF/views/setup-admin.jsp`.
      required: [token, nome, cargo, email, senha]
      properties:
        token:
          type: string
          format: password
          description: Deve ser igual à variável de ambiente `INITIAL_ADMIN_TOKEN`.
        nome:
          type: string
          maxLength: 100
        cargo:
          type: string
          maxLength: 60
        email:
          type: string
          format: email
          maxLength: 150
        senha:
          type: string
          format: password
          minLength: 8
    CadastroClienteForm:
      type: object
      description: Campos aceitos por `POST /cadastro` (aparados com `trim`, exceto `senha`).
      required: [nome, cpf, telefone, email, senha]
      properties:
        nome:
          type: string
          maxLength: 100
        cpf:
          type: string
          description: Caracteres não numéricos são removidos; deve restar exatamente 11 dígitos.
          example: "123.456.789-01"
        telefone:
          type: string
          description: Caracteres não numéricos são removidos; deve restar 10 ou 11 dígitos (DDD + número).
          example: "(11) 98765-4321"
        email:
          type: string
          format: email
          maxLength: 150
        senha:
          type: string
          format: password
          minLength: 8
    VeiculoForm:
      type: object
      description: Campos de `WEB-INF/views/veiculos.jsp`.
      required: [acao]
      properties:
        acao:
          type: string
          enum: [adicionar, remover]
        idVeiculo:
          type: integer
          description: Obrigatório para `remover`.
        placa:
          type: string
          maxLength: 10
          description: Obrigatório para `adicionar`; convertida para maiúsculas.
        marca:
          type: string
          maxLength: 60
          description: Obrigatório para `adicionar`.
        modelo:
          type: string
          maxLength: 60
          description: Obrigatório para `adicionar`.
        cor:
          type: string
          maxLength: 30
    AgendamentoForm:
      type: object
      description: Campos de `WEB-INF/views/agendamentos.jsp`.
      required: [acao]
      properties:
        acao:
          type: string
          enum: [agendar, cancelar]
        idAgendamento:
          type: integer
          description: Obrigatório para `cancelar`.
        idVeiculo:
          type: integer
          description: Obrigatório para `agendar`.
        data:
          type: string
          format: date
          description: Obrigatório para `agendar`; não pode ser anterior a hoje.
        horario:
          type: string
          pattern: "^\\d{2}:\\d{2}(:\\d{2})?$"
          example: "14:30"
          description: Obrigatório para `agendar` (`LocalTime.parse`).
        idServicos:
          type: array
          description: Obrigatório para `agendar`; ao menos um ID positivo (parâmetro repetido).
          items:
            type: integer
            minimum: 1
    ServicoForm:
      type: object
      description: "`POST /admin/servicos` (ADMINISTRADOR)."
      required: [acao]
      properties:
        acao:
          type: string
          enum: [salvar, remover]
        idServico:
          type: integer
          description: Obrigatório para `remover`; em `salvar`, vazio cria e preenchido atualiza.
        nome:
          type: string
          maxLength: 100
          description: Obrigatório para `salvar`.
        descricao:
          type: string
          maxLength: 255
        preco:
          type: string
          description: Obrigatório para `salvar`. Decimal ≥ 0, até 10 dígitos e 2 casas; aceita vírgula.
          example: "49,90"
    ColaboradorForm:
      type: object
      description: "`POST /admin/colaboradores` (ADMINISTRADOR)."
      required: [nome, cargo, email, senha, nivelAcesso]
      properties:
        nome:
          type: string
          maxLength: 100
        cargo:
          type: string
          maxLength: 60
        email:
          type: string
          format: email
          maxLength: 150
        senha:
          type: string
          format: password
          minLength: 8
        nivelAcesso:
          $ref: "#/components/schemas/NivelAcesso"
    AtendimentoForm:
      type: object
      description: "`POST /admin/atendimentos` (OPERACIONAL ou superior)."
      required: [idAtendimento, status]
      properties:
        idAtendimento:
          type: integer
        status:
          type: string
          enum: [AGUARDANDO, EM_LAVAGEM, FINALIZADO, ENTREGUE]
        idColaboradores:
          type: array
          description: Colaboradores responsáveis (parâmetro repetido; IDs positivos).
          items:
            type: integer
            minimum: 1
    PagamentoForm:
      type: object
      description: "`POST /admin/pagamentos` (ATENDENTE ou superior)."
      required: [idPagamento, status]
      properties:
        idPagamento:
          type: integer
        status:
          type: string
          enum: [PAGO, CANCELADO]
        formaPagamento:
          type: string
          description: Obrigatório quando `status=PAGO`.
          enum: [DINHEIRO, PIX, CREDITO, DEBITO]
    NivelAcesso:
      type: string
      enum: [OPERACIONAL, ATENDENTE, ADMINISTRADOR]
    VeiculoCliente:
      type: object
      description: DTO `model.dto.VeiculoView` (atributo `veiculos` em `/veiculos` e `/agendamentos`).
      properties:
        id:
          type: integer
        placa:
          type: string
        marca:
          type: string
        modelo:
          type: string
        cor:
          type: string
